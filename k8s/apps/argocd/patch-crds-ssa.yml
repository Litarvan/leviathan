---
# The Argo CD CRDs are too big to be applied client-side: kubectl/Argo CD stores
# the whole manifest in the kubectl.kubernetes.io/last-applied-configuration
# annotation, which may not exceed 262144 bytes (applicationsets alone is ~1.4M).
# Server-side apply doesn't use that annotation at all.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: patched-by-target
  annotations:
    argocd.argoproj.io/sync-options: ServerSideApply=true
