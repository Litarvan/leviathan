---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd

resources:
  - namespace.yml
  - github.com/argoproj/argo-cd/manifests/cluster-install?ref=v3.5.0
  - ingress-route.yml
  - apps/

patches:
  - path: patch-argocd-cm.yml
  - path: patch-argocd-cmd-params-cm.yml
  - path: patch-argocd-rbac-cm.yml
  - path: patch-crds-ssa.yml
    target:
      group: apiextensions.k8s.io
      kind: CustomResourceDefinition
