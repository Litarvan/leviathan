---
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: rke2-traefik
  namespace: kube-system
spec:
  valuesContent: |-
    providers:
      kubernetesCRD:
        enabled: true
        # The chart defaults this to "traefik", which makes the CRD provider skip
        # every IngressRoute that lacks a matching kubernetes.io/ingress.class
        # annotation -- i.e. all of ours. Empty means "no annotation, or the value
        # traefik" is accepted, which is what we want.
        ingressClass: ""
      kubernetesIngress:
        enabled: false
      kubernetesGateway:
        enabled: false
    ingressClass:
      enabled: false

    service:
      # This chart defaults service.type to ClusterIP; ServiceLB needs a
      # LoadBalancer service to expose Traefik (and externalTrafficPolicy:
      # Local is only valid on LoadBalancer/NodePort services).
      type: LoadBalancer
      spec:
        # Without this, ServiceLB masquerades the client IP and every request
        # reaches Traefik from a pod IP: per-IP rate limiting and Nextcloud's
        # brute-force protection would then apply to everyone at once.
        externalTrafficPolicy: Local

    deployment:
      additionalVolumes:
        - name: traefik-data
          hostPath:
            path: /var/traefik
            type: Directory
    additionalVolumeMounts:
      - name: traefik-data
        mountPath: /var/traefik

    env:
      - name: NETLIFY_TOKEN_FILE
        value: /var/traefik/netlify-token

    certificatesResolvers:
      acme-netlify:
        acme:
          email: acme-a8d7@litarvan.com
          storage: /var/traefik/acme.json
          dnsChallenge:
            provider: netlify

    ports:
      web:
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
              permanent: true
      websecure:
        http3:
          enabled: true

          # Traefik builds the Alt-Svc header from the entryPoint's own port,
          # which is the in-container 8443, not the 443 the service publishes.
          # Browsers cached "h3=:8443" (ma=2592000, so for 30 days) and kept
          # opening QUIC connections to a port nothing listens on, stalling
          # until they gave up and fell back to TCP. Only 443/udp is exposed.
          advertisedPort: 443
        http:
          middlewares:
            - kube-system-default-headers@kubernetescrd
          tls:
            enabled: true
            certResolver: acme-netlify
            domains:
              - main: litarvan.com
                sans:
                  - "*.litarvan.com"
                  - "*.leviathan.litarvan.com"
                  - "*.meow.litarvan.com"
                  - "*.nix.litarvan.com"
        transport:
          respondingTimeouts:
            readTimeout: 1800s
